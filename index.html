<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ashutosh Pandey</title>
    <meta name="theme-color" content="#0a0a0a">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;600&display=swap">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-900 text-white">
    <a href="#themeContainer" class="skip-link shell-ui">Skip to content</a>

    <!-- Theme Container -->
    <div id="themeContainer" tabindex="-1"></div>

    <!-- Theme switcher: same spot (bottom-right) in every theme; themes keep that corner clear -->
    <button id="themeDock" type="button" class="theme-dock shell-ui" aria-haspopup="dialog" aria-controls="themeChooser" aria-label="Change theme">
        <span id="themeDockTile" class="theme-tile theme-tile--sm" aria-hidden="true"></span>
        <span id="themeDockLabel" class="theme-dock-label"></span>
        <i class="fas fa-chevron-up theme-dock-chevron" aria-hidden="true"></i>
    </button>

    <!-- Theme chooser: opens on every visit with the current theme preselected; collapses into the switcher -->
    <dialog id="themeChooser" class="chooser shell-ui" aria-labelledby="themeChooserTitle" aria-describedby="themeChooserHint">
        <div class="chooser-panel" tabindex="-1">
            <header class="chooser-head">
                <div>
                    <h2 id="themeChooserTitle" class="chooser-title">Choose a Theme</h2>
                    <p id="themeChooserHint" class="chooser-hint"></p>
                </div>
                <button type="button" class="chooser-icon-btn" data-collapse aria-label="Collapse theme chooser">
                    <i class="fas fa-down-left-and-up-right-to-center" aria-hidden="true"></i>
                </button>
            </header>
            <div id="themeChooserList" class="chooser-list"></div>
            <footer class="chooser-foot">
                <p class="chooser-foot-hint"><kbd>Esc</kbd> to collapse</p>
                <div class="chooser-actions">
                    <a id="themeChooserResume" class="chooser-secondary" hidden>
                        <i class="fas fa-arrow-down" aria-hidden="true"></i><span><span class="chooser-wide-only">Download </span>Résumé</span>
                    </a>
                    <button id="themeChooserContinue" type="button" class="chooser-primary" data-collapse></button>
                </div>
            </footer>
        </div>
    </dialog>

    <!-- Scripts -->
    <script src="js/content.js"></script>
    <script src="js/caricature.js"></script>

    <!-- Original Themes -->
    <script src="js/themes/chatgpt.js"></script>
    <script src="js/themes/modelcard.js"></script>
    <script src="js/themes/vscode.js"></script>
    <script src="js/themes/terminal.js"></script>
    <script src="js/themes/neural.js"></script>
    <script src="js/themes/notebook.js"></script>

    <!-- New Themes -->
    <script src="js/themes/paper.js"></script>
    <script src="js/themes/api.js"></script>
    <script src="js/themes/book.js"></script>
    <script src="js/themes/prompt.js"></script>
    <script src="js/themes/apple.js"></script>
    <script src="js/themes/scifi.js"></script>
    <script src="js/themes/gitdiff.js"></script>
    <script src="js/themes/json.js"></script>
    <script src="js/themes/training.js"></script>

    <script src="js/main.js"></script>
</body>
</html>
